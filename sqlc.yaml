version: "2"
sql:
  - engine: "postgresql"
    queries: "db/wallet/queries"
    schema: "db/wallet/migrations"
    gen:
      go:
        package: "db"
        out: "internal/wallet/db"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
